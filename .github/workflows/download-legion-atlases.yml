name: Download Official Legion Atlases
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/download-legion-atlases.yml"
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original Legion DDS atlases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legion-atlases
          for name in leg_color leg_shader leg_normal; do
            curl -fL --retry 3 --retry-delay 3 \
              "https://raw.githubusercontent.com/RandomGuyJunior/Beyond-All-Reason/master/unittextures/${name}.dds" \
              -o "legion-atlases/${name}.dds"
          done
          file legion-atlases/*.dds
          sha256sum legion-atlases/*.dds > legion-atlases/SHA256SUMS
          python3 - <<'PY'
          from pathlib import Path
          for p in Path("legion-atlases").glob("*.dds"):
              assert p.stat().st_size>1000000 and p.read_bytes()[:4]==b"DDS ", p
              print(p.name,p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-legion-color
          compression-level: 0
          path: legion-atlases/leg_color.dds
      - uses: actions/upload-artifact@v4
        with:
          name: official-legion-shader
          compression-level: 0
          path: legion-atlases/leg_shader.dds
      - uses: actions/upload-artifact@v4
        with:
          name: official-legion-normal
          compression-level: 0
          path: legion-atlases/leg_normal.dds
      - uses: actions/upload-artifact@v4
        with:
          name: official-legion-hashes
          path: legion-atlases/SHA256SUMS
